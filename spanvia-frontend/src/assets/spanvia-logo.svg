<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="spanviaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A3412" />
      <stop offset="50%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Heritage Temple / Arch Motif -->
  <g transform="translate(5, 5)">
    <!-- Base platform -->
    <rect x="5" y="44" width="40" height="4" rx="2" fill="url(#spanviaGrad)" />
    <!-- Pillars -->
    <rect x="10" y="24" width="4" height="20" fill="url(#spanviaGrad)" />
    <rect x="23" y="20" width="4" height="24" fill="url(#spanviaGrad)" />
    <rect x="36" y="24" width="4" height="20" fill="url(#spanviaGrad)" />
    <!-- Heritage Arch -->
    <path d="M 8,24 C 8,10 42,10 42,24 Z" fill="none" stroke="url(#spanviaGrad)" stroke-width="3.5" />
    <!-- Kalasha / Dome Spire -->
    <path d="M 25,6 L 20,16 L 30,16 Z" fill="url(#goldGrad)" />
    <circle cx="25" cy="5" r="2.5" fill="#D97706" />
  </g>

  <!-- Brand Typography -->
  <text x="62" y="35" font-family="'Playfair Display', 'Georgia', serif" font-size="28" font-weight="800" fill="#9A3412" letter-spacing="1">SPANVIA</text>
  <text x="63" y="48" font-family="'Plus Jakarta Sans', 'Arial', sans-serif" font-size="8.5" font-weight="800" fill="#D97706" letter-spacing="2.5">HERITAGE TOURISM</text>
</svg>
